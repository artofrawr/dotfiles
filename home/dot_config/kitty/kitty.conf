# font 
font_family                 SFMono Nerd Font Regular
font_size                   12.0
text_composition_strategy   legacy

# os window
macos_titlebar_color background

# cursor
cursor_shape            block
shell_integration       enabled no-cursor
cursor_blink_interval   0


# keys
# Send a distinct CSI-u sequence for Shift+Enter so it survives through tmux
# (otherwise legacy mode sends a plain CR, indistinguishable from Enter).
map shift+enter send_text all \x1b[13;2u

# color scheme
include ./nord.conf
