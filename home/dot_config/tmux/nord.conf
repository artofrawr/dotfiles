# nord palette as user options
set -g @nord0  "#2e3440"
set -g @nord1  "#3b4252"
set -g @nord2  "#434c5e"
set -g @nord3  "#4c566a"
set -g @nord4  "#d8dee9"
set -g @nord6  "#eceff4"
set -g @nord8  "#88c0d0"
set -g @nord9  "#81a1c1"

# Status bar
set -g status-style "bg=#{@nord0},fg=#{@nord4}"
set -g status-left "#[bg=#{@nord8},fg=#{@nord0},bold] #S #[bg=#{@nord0},fg=#{@nord8}]"
set -g status-left-length 30
set -g status-right "#[fg=#{@nord3}]#[bg=#{@nord3},fg=#{@nord4}] %H:%M #[bg=#{@nord3},fg=#{@nord9}]#[bg=#{@nord9},fg=#{@nord0},bold] %d-%b "

# Windows
set -g window-status-format "#[fg=#{@nord4}] #I:#W "
set -g window-status-current-format "#[bg=#{@nord2},fg=#{@nord8}]#[bg=#{@nord2},fg=#{@nord6},bold] #I:#W #[bg=#{@nord0},fg=#{@nord2}]"
set -g window-status-separator ""

# Panes
set -g pane-border-style "fg=#{@nord1}"
set -g pane-active-border-style "fg=#{@nord8}"

# Messages
set -g message-style "bg=#{@nord1},fg=#{@nord6}"
set -g message-command-style "bg=#{@nord1},fg=#{@nord6}"

# Clock (colour-type option: no #{...} format expansion, use literal hex)
set -g clock-mode-colour "#88c0d0"
