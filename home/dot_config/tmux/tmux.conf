source-file ~/.config/tmux/nord.conf

# Enable passthrough and extended keys globally
set -g allow-passthrough on
set -s extended-keys always

# Correctly target Kitty's terminal feature string
set -as terminal-features ',xterm-kitty:extkeys'

# Hard-bind Shift+Enter to send the exact CSI-u sequence Claude Code expects
bind-key -n S-Enter send-keys Escape "[13;2u"

# allow mouse scrolling
set -g mouse on
